<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1d1a16" />
    <meta name="description" content="Drive a yellow-and-maroon Micra taxi from Iwo Road to Ojoo through Ibadan traffic before time runs out." />
    <meta property="og:title" content="Oya Move! Ibadan" />
    <meta property="og:description" content="Can you drive from Iwo Road to Ojoo before time runs out?" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Oya Move! Ibadan</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1d1a16;
        /* Stop mobile browsers from selecting text / zooming while you tap the controls */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
